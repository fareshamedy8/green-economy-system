<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خطأ {{ code }} – نظام متابعة الاقتصاد الأخضر</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" />
</head>
<body>
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;background:var(--bg-main,#f5faf7)">
  <div style="width:80px;height:80px;background:var(--accent-light,#d4f5e2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem">
    <i class="fa-solid fa-leaf" style="font-size:2.5rem;color:var(--accent,#2e9e5e)"></i>
  </div>
  <h1 style="font-size:5rem;font-weight:900;color:var(--primary,#1a5c38);line-height:1;margin:0">{{ code }}</h1>
  <h2 style="margin:.75rem 0;font-size:1.4rem;color:var(--text-main,#1a2e24)">{{ message }}</h2>
  <p style="color:var(--text-muted,#6b8f72);margin-bottom:2rem">عذراً، حدث خطأ ما. يمكنك العودة للصفحة الرئيسية.</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.5rem;background:var(--accent,#2e9e5e);color:#fff;border-radius:8px;font-weight:600">
    <i class="fa-solid fa-house"></i> العودة للرئيسية
  </a>
</div>
<script>
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
</script>
</body>
</html>
