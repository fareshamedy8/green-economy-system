<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accounting — Simple UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('accounting.static', filename='accounting/styles.css') }}" rel="stylesheet">
  </head>
  <body class="p-4">
    <div class="container">
      <h1>Accounting — Admin</h1>
      <p class="text-muted">Simple frontend for Chart of Accounts, Transactions and Trial Balance.</p>

      <div class="row">
        <div class="col-md-6">
          <h4>Chart of Accounts</h4>
          <div id="accounts-list"></div>

          <h5 class="mt-3">Add Account</h5>
          <form id="account-form" class="row g-2">
            <div class="col-4"><input class="form-control" name="code" placeholder="Code"></div>
            <div class="col-4"><input class="form-control" name="name" placeholder="Name"></div>
            <div class="col-4"><select class="form-select" name="type"><option value="asset">Asset</option><option value="liability">Liability</option><option value="equity">Equity</option><option value="revenue">Revenue</option><option value="expense">Expense</option></select></div>
            <div class="col-12"><button class="btn btn-primary">Create Account</button></div>
          </form>
        </div>

        <div class="col-md-6">
          <h4>Create Transaction</h4>
          <form id="tx-form">
            <div class="mb-2"><input class="form-control" name="reference" placeholder="Reference"></div>
            <div class="mb-2"><input class="form-control" name="date" placeholder="YYYY-MM-DD"></div>
            <div class="mb-2"><input class="form-control" name="description" placeholder="Description"></div>

            <h6>Entries</h6>
            <div id="entries"></div>
            <button id="add-entry" class="btn btn-sm btn-outline-secondary mb-2" type="button">+ Add Entry</button>
            <div><button class="btn btn-success" type="submit">Post Transaction</button></div>
          </form>

          <h4 class="mt-4">Trial Balance</h4>
          <div id="trial-balance"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="{{ url_for('accounting.static', filename='accounting/app.js') }}"></script>
  </body>
</html>
